<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3T Admin Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-box {
            background: #fff;
            padding: 40px;
            border-radius: 4px;
            max-width: 400px;
            width: 100%;
        }
        .logo {
            background: #C4FF00;
            color: #000;
            padding: 16px;
            text-align: center;
            font-weight: 800;
            margin-bottom: 32px;
            border-radius: 4px;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 13px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }
        input:focus {
            outline: none;
            border-color: #C4FF00;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #000;
            color: #C4FF00;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }
        button:hover {
            background: #111;
        }
        .error {
            color: #d32f2f;
            font-size: 12px;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">3T PRINT SOLUTIONS</div>
        <h1>Admin Login</h1>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <button type="submit">Sign In</button>
            <div id="error" class="error"></div>
        </form>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            // For now, hardcoded admin:3tprint-admin-2026
            if (username === 'admin' && password === '3tprint-admin-2026') {
                localStorage.setItem('admin', JSON.stringify({ username, id: 1 }));
                window.location.href = '/admin/';
            } else {
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Invalid credentials';
            }
        }
    </script>
</body>
</html>
