<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Received — 3T Print Solutions</title>
<link rel="stylesheet" href="/css/brand.css">
<link rel="stylesheet" href="/css/quote.css">
</head>
<body>
<header class="site-header">
  <div><a href="/" class="logo" aria-label="Go to 3T Print Solutions homepage"><span class="dot"></span>3T PRINT SOLUTIONS</a><div class="tagline">Custom DTF Apparel</div></div>
</header>
<div class="container">
  <div class="quote-wrap">
    <div class="card order-received-hero">
      <div class="check">✓</div>
      <h1 class="section-title">Order Received</h1>
      <p class="section-sub">Your order has been submitted to 3T Print Solutions. We'll review your garment selections, artwork, print specifications, and order details before production.</p>
    </div>

    <div class="card qcard">
      <h2>Order Details</h2>
      <div class="detail-grid" id="orderDetails"></div>
    </div>

    <div class="card qcard">
      <h2>Garment</h2>
      <div id="garmentSummary"></div>
    </div>

    <div class="card qcard">
      <h2>Artwork</h2>
      <div id="artworkSummary"></div>
    </div>

    <div class="text-center mt-24">
      <a href="/index.html" class="btn btn-outline">Start a New Order</a>
    </div>
  </div>
</div>
<script src="/js/order-received.js"></script>
</body>
</html>
