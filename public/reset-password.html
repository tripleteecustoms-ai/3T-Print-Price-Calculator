<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose a New Password — 3T Print Solutions</title>
<link rel="stylesheet" href="/css/brand.css">
</head>
<body>
<header class="site-header">
  <div>
    <a href="/" class="logo" aria-label="Go to 3T Print Solutions homepage"><span class="dot" id="siteLogoDot"></span><span id="siteLogoText">3T PRINT SOLUTIONS</span></a>
    <div class="tagline">Your Account</div>
  </div>
</header>
<div class="container">
  <div style="max-width:440px;margin:0 auto;padding:36px 0 56px;">
    <h1 class="section-title" style="font-size:28px;">Choose a new password</h1>
    <div id="note" class="hidden" role="status" style="padding:12px 14px;border-radius:var(--radius-md);font-size:14px;margin:14px 0;background:var(--3t-red-soft);color:var(--3t-red);"></div>
    <form id="resetForm" class="card" style="margin-top:18px;" novalidate>
      <div class="field"><label for="password">New password</label><input type="password" id="password" autocomplete="new-password">
        <div class="muted" style="font-size:12px;margin-top:6px;">At least 8 characters.</div></div>
      <div class="field"><label for="password2">Type it again</label><input type="password" id="password2" autocomplete="new-password"></div>
      <button type="submit" class="btn btn-primary btn-block">Save new password</button>
    </form>
  </div>
</div>
<script src="/js/brand-header.js"></script>
<script>
const note = (text) => { const el = document.getElementById('note'); el.textContent = text; el.classList.toggle('hidden', !text); };
document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('password').value;
  if (password !== document.getElementById('password2').value) return note('The two passwords do not match.');
  const resp = await fetch('/api/account/reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: new URLSearchParams(location.search).get('token'), password }) });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) return note(data.error || 'Something went wrong. Please try again.');
  location.href = '/login?reset=1';
});
</script>
</body>
</html>
